name = "merchant-check-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1: precomputed merchant-signal store. check_merchant only ever reads from
# this — no live chain lookups on the paid request path.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "merchant-signals"
database_id = "0964f469-94f4-4da1-94a7-6033d89ccb9a"

# ---------------------------------------------------------------------------
# Two independent scheduled jobs share the scheduled() handler in
# src/index.ts, which branches on controller.cron:
#   - "0 */4 * * *"  trust-signal refresh (src/refresh), every 4 hours.
#   - "0 0 1 * *"    categorization force re-run (src/categorize), monthly
#                    (1st of the month) — MUST match MONTHLY_CATEGORIZATION_CRON
#                    in src/index.ts if ever changed. Deliberately not the
#                    same cadence as the trust-signal refresh — requirement 6.
# ---------------------------------------------------------------------------
[triggers]
crons = ["0 */4 * * *", "0 0 1 * *"]

# ---------------------------------------------------------------------------
# Workers Logs (2026-08-19) — enabled at the user's request to get real
# per-request logs (path, status, duration, errors) instead of inferring
# traffic patterns from the Metrics tab's per-version/per-datacenter
# aggregates. Free tier, up to 200K events/day, sampled beyond that. Set
# here rather than via the dashboard toggle: the dashboard's "Enable
# Observability" button was reproducibly redirecting to Settings instead of
# committing (tried 4 times) — this is the config it would have written
# anyway, per the diff it showed before failing to save.
# ---------------------------------------------------------------------------
[observability.logs]
enabled = true
invocation_logs = true

# ---------------------------------------------------------------------------
# Custom domains. gradientdecisions.com is already a Cloudflare zone on this
# account, so `custom_domain = true` provisions the DNS record + SSL cert
# automatically on deploy — no manual CNAME needed.
#
# mcp.* is the agent-facing paid MCP endpoint; the apex + www serve the
# human-facing dashboard (same Worker, routed by pathname — see src/index.ts).
# Confirmed via `dig` on 2026-08-10 that the apex and www had zero existing
# DNS records before this was added — nothing pre-existing was overwritten.
# ---------------------------------------------------------------------------
[[routes]]
pattern = "mcp.gradientdecisions.com"
custom_domain = true

[[routes]]
pattern = "gradientdecisions.com"
custom_domain = true

[[routes]]
pattern = "www.gradientdecisions.com"
custom_domain = true

[vars]
# Public config only. Secrets (PAYOUT_ADDRESS, ANTHROPIC_API_KEY,
# CDP_API_KEY_ID, CDP_API_KEY_SECRET) go through `wrangler secret put`, not
# here.
# Network is CAIP-2 format (@x402/core v2 protocol) — eip155:84532 is Base
# Sepolia, eip155:8453 is Base mainnet.
#
# Switched to mainnet 2026-08-11 — deliberate, explicitly-confirmed switch
# (see README "Going to mainnet"). NOT actually settling real payments yet
# though: the free public x402.org facilitator this project used throughout
# is testnet-only, confirmed via a real failed mainnet call ("Facilitator
# does not support exact on eip155:8453"). Real settlement needs Coinbase's
# authenticated CDP production facilitator — see src/index.ts
# getResourceServer and CDP_API_KEY_ID/SECRET below. Don't flip back to
# testnet or change PAYOUT_ADDRESS without the same kind of explicit
# confirmation as the original switch, since either would misdirect funds.
X402_NETWORK = "eip155:8453"
# PAYOUT_ADDRESS: real Base mainnet address, set via `wrangler secret put`.
# You provided this address directly; I never held or generated its key.
# ANTHROPIC_API_KEY: set via `wrangler secret put ANTHROPIC_API_KEY` — powers
# the categorization pass-2 model fallback (src/categorize/model.ts).
# Optional: unset just means everything the rule pass can't confidently
# place lands in 'other' and gets logged for review instead of erroring.
# CDP_API_KEY_ID / CDP_API_KEY_SECRET: set via `wrangler secret put` (both) —
# required for real mainnet settlement to actually work. Get them from
# portal.cdp.coinbase.com (free CDP account, then create an API key —
# same account-creation-must-be-you pattern as ANTHROPIC_API_KEY).
